services:
  app:
    build: .
    image: tungedng2710/tonrag:latest
    container_name: tonrag-app
    init: true
    ports:
      - "7865:7865"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - chroma-model-cache:/root/.cache/chroma
    environment:
      - PYTHONPATH=/app
      - UVICORN_WORKERS=1
      - CHROMA_QUERY_MODE=text
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 7865
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7865/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  chroma-model-cache:
